# sqlc.yaml — configures the build-time code generator (Chapter 8).
#
# All of Beacon's CRUD repositories are generated from the .sql files below into
# ONE Go package, internal/db. The migrations in migrations/ are the schema
# source of truth; sqlc reads them to learn column types so it can type-check the
# queries and emit row structs. The hand-written repos in each internal/<domain>/
# package now call these generated functions and map the rows into their existing
# domain structs.
#
# Layout note: the course threads one .sql file per domain into that domain's own
# package. We instead point every query file at a single internal/db package — a
# layout choice that keeps one importable Queries type while still being plain
# sqlc-generated code.
version: "2"
sql:
  - engine: postgresql
    # The schema lives in the migrations — the source of truth.
    schema: migrations
    # One query file per domain, all generated into internal/db.
    queries:
      - internal/db/queries/users.sql
      - internal/db/queries/orgs.sql
      - internal/db/queries/projects.sql
      - internal/db/queries/tasks.sql
      - internal/db/queries/attachments.sql
      - internal/db/queries/webhooks.sql
      - internal/db/queries/idempotency.sql # Ch 14
      - internal/db/queries/search.sql      # Ch 29–30
      - internal/db/queries/flags.sql       # Ch 31
      - internal/db/queries/experiments.sql # Ch 32
      - internal/db/queries/audit.sql       # Ch 10
      # NOTE: the jobs queue stays hand-written pgx — its worker claims rows with
      # FOR UPDATE SKIP LOCKED inside a transaction (the Chapter 26 mechanism),
      # which is awkward to express through sqlc. sqlc covers the CRUD repos.
    gen:
      go:
        out: internal/db
        package: db
        sql_package: pgx/v5
        emit_json_tags: true
        emit_pointers_for_null_types: true
        emit_db_tags: false
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        overrides:
          # UUIDs become google/uuid values, not pgtype.UUID — the ergonomic
          # type the rest of the codebase already speaks.
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          # Timestamps as time.Time (and *time.Time when nullable).
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
