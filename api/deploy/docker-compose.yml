# Local dependencies for Beacon. Postgres is the only hard requirement; Mailpit
# (Ch 23, captures outgoing email at http://localhost:8025) and MinIO (Ch 22,
# S3-compatible storage, console at http://localhost:9001) are dev conveniences
# for the Phase-3 boundaries. The service boots fine with only Postgres — email
# falls back to the log sender and attachment endpoints return 501 until you set
# the matching S3_*/SMTP_* env vars in .env.
#
#   docker compose -f deploy/docker-compose.yml up -d
#
services:
  postgres:
    image: postgres:16-alpine
    container_name: beacon-postgres
    environment:
      POSTGRES_USER: beacon
      POSTGRES_PASSWORD: beacon
      POSTGRES_DB: beacon
    ports:
      - "5432:5432"
    volumes:
      - beacon_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beacon -d beacon"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Mailpit — a throwaway SMTP server that swallows every email and shows it in a
  # web UI. Point SMTP_HOST=localhost SMTP_PORT=1025 at it (Ch 23).
  mailpit:
    image: axllent/mailpit:latest
    container_name: beacon-mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"

  # MinIO — S3-compatible object storage for attachments (Ch 22). Create the
  # bucket once: `mc alias set local http://localhost:9000 minioadmin minioadmin
  # && mc mb local/beacon`, or via the console at http://localhost:9001.
  minio:
    image: minio/minio:latest
    container_name: beacon-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - beacon_miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Redis — the cross-machine cache layer (Ch 28). Optional: leave REDIS_URL
  # empty and the cache degrades to the in-process LRU only, which still works,
  # just per-instance. `redis-cli monitor` here is the fastest way to watch a
  # cache hit turn into no database query at all.
  redis:
    image: redis:7-alpine
    container_name: beacon-redis
    command: redis-server --save "" --appendonly no
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Meilisearch — the search engine Chapter 30 graduates to when Postgres FTS
  # runs out (typo tolerance, per-document language, facets). Optional: leave
  # MEILI_URL empty and search stays on the Chapter 29 Postgres path.
  meilisearch:
    image: getmeili/meilisearch:v1.16
    container_name: beacon-meili
    environment:
      MEILI_MASTER_KEY: beacon-dev-master-key
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - beacon_meilidata:/meili_data

  # OpenTelemetry Collector — where Beacon's spans go (Ch 36). The debug
  # exporter prints each trace to the container log:
  #   docker logs -f beacon-otel
  # Optional: leave OTEL_EXPORTER_OTLP_ENDPOINT unset and tracing is off.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    container_name: beacon-otel
    command: ["--config=/etc/otel/collector.yaml"]
    volumes:
      - ./otel/collector.yaml:/etc/otel/collector.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP

  # Prometheus — scrapes the internal port (Ch 35) and is what the Chapter 47
  # canary gate queries. UI at http://localhost:9091.
  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: beacon-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9091:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  beacon_pgdata:
  beacon_miniodata:
  beacon_meilidata:
