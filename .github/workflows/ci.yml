# Beacon CI.
#
# The jobs are ordered by how fast they tell you something useful. `contract`
# runs first and alone because it is the check this repository exists for: it
# regenerates openapi.json from the Go handlers and the TypeScript SDK from
# that document, and fails if either differs from what was committed. A
# handler changed without a regenerated client is a red build here rather than
# a runtime surprise a user reports next week.
#
# Everything a job needs is a `make` target. If a command lives here and
# nowhere else, nobody can run it locally, and a check nobody can reproduce is
# a check people learn to ignore.

name: ci

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes the run in flight for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "24"

jobs:
  # ---------------------------------------------------------------------------
  contract:
    name: contract is in step with the handlers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - run: cd sdk && npm ci
      - run: make contract

  # ---------------------------------------------------------------------------
  api:
    name: go
    runs-on: ubuntu-latest

    # The integration tests skip themselves unless TEST_DATABASE_URL is set
    # (internal/testsupport/db.go explains why). CI is where they must NOT
    # skip, so it supplies a real Postgres and sets the variable.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: beacon
          POSTGRES_PASSWORD: beacon
          POSTGRES_DB: beacon_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U beacon -d beacon_test"
          --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api/go.sum

      - name: gofmt
        working-directory: api
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"; echo "$unformatted"
            exit 1
          fi

      - run: make -C api vet

      - name: test (integration included)
        working-directory: api
        env:
          TEST_DATABASE_URL: postgres://beacon:beacon@localhost:5432/beacon_test?sslmode=disable
        run: go test -race ./...

  # ---------------------------------------------------------------------------
  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: cd web && npm run lint
      - run: cd web && npm run test

      # `build` is four guards in one: gen:tokens refuses to emit a palette
      # that fails contrast, tsc --noEmit, the Vite build, and the performance
      # budget. Any of the four can fail this step, which is the intent.
      - run: cd web && npm run build

  # ---------------------------------------------------------------------------
  e2e:
    name: e2e against a real Beacon
    runs-on: ubuntu-latest
    needs: [api, web]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: beacon
          POSTGRES_PASSWORD: beacon
          POSTGRES_DB: beacon
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U beacon -d beacon"
          --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      # A mocked backend proves the client agrees with the mock. Every real bug
      # this project has hit — the CORS preflight that forbade Idempotency-Key,
      # the five list endpoints with the wrong envelope, the webhook secret
      # returned on every list call — passed against a mock and failed against
      # the server. So the suite gets the server.
      - name: start Beacon
        working-directory: api
        env:
          DATABASE_URL: postgres://beacon:beacon@localhost:5432/beacon?sslmode=disable
          JWT_SECRET: ci-only-not-a-real-secret
          CORS_ORIGINS: http://localhost:5180
        run: |
          go run ./cmd/beacon-api &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/healthz >/dev/null && exit 0
            sleep 1
          done
          echo "Beacon never became healthy"; exit 1

      - run: cd web && npm ci
      - run: cd web && npx playwright install --with-deps chromium
      - run: cd web && npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------------------
  visual:
    name: visual regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Both the app and the browser run in containers, which is why the
      # baselines committed from a laptop match what this runner renders.
      # See web/playwright.visual.config.ts for why that is not optional.
      - run: make visual

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diff
          path: web/test-results/
          retention-days: 7

  # ---------------------------------------------------------------------------
  images:
    name: container images build
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      # Build only — nothing is pushed. There is no registry configured for
      # this project yet, and a workflow that pretends to publish is worse
      # than one that admits it does not.
      - name: api image
        uses: docker/build-push-action@v6
        with:
          context: api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
