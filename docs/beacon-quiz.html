/* Light is the base palette. Dark redefines ONLY tokens, in two blocks:
   the media query (guarded so an explicit light choice beats a dark OS) and
   the [data-theme="dark"] stamp (so a toggle wins in the other direction).
   Nothing below the token blocks names a raw colour, which is what keeps the
   un-stamped system-default state from rendering one theme on the other's ground. */
:root{
  --page:#D6EDF7; --panel:#E4F4FA; --card:#FFFFFF;
  --deep:#0B5E7A; --deep-press:#084C63; --deep-soft:#2E85A3; --on-deep:#FFFFFF;
  --ink:#0A3F53; --muted:#7FB2C6; --lede:#3D7A93;
  --line:#BCDDEA; --bar:#CFE7F1; --chip:#EAF6FB; --sel:#F2FAFD; --ghost-hover:#EDF7FB;
  --ok:#2F9E7E; --ok-bg:#E4F5EF; --ok-text:#1C6B55;
  --no:#DE7B5C; --no-bg:#FCEDE7; --no-text:#A64A2E;
  --why-bg:#F4FAFD; --why-text:#255E75; --why-code:#E1F0F7;
  --shadow:rgba(11,94,122,.28); --shadow2:rgba(11,94,122,.06);
  --ill-o:#E8825E; --ill-y:#F2C94C; --ill-b:#4A9FD4;
  --ill-p:#F4B8AC; --ill-s:#F6E3C5; --ill-d:#0B5E7A;
  --display:"Archivo Black",system-ui,sans-serif;
  --mono:"JB Mono",ui-monospace,monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#061E28; --panel:#0B2A36; --card:#103543;
    --deep:#7FD4EE; --deep-press:#A5E2F5; --deep-soft:#4FA8C7; --on-deep:#06222D;
    --ink:#DCEEF5; --muted:#6E9DB0; --lede:#9FC4D4;
    --line:#1E4A5C; --bar:#17394A; --chip:#0E313F; --sel:#14404F; --ghost-hover:#17414F;
    --ok:#4FC4A0; --ok-bg:#0F3A32; --ok-text:#7FE0C0;
    --no:#E9906F; --no-bg:#3D2018; --no-text:#F2B49B;
    --why-bg:#0F3241; --why-text:#B8DCEA; --why-code:#17404F;
    --shadow:rgba(0,0,0,.5); --shadow2:rgba(0,0,0,.25);
    --ill-o:#D9744F; --ill-y:#D4AC42; --ill-b:#4C9FCB;
    --ill-p:#B77F73; --ill-s:#23414F; --ill-d:#7FD4EE;
  }
}
:root[data-theme="dark"]{
  --page:#061E28; --panel:#0B2A36; --card:#103543;
  --deep:#7FD4EE; --deep-press:#A5E2F5; --deep-soft:#4FA8C7; --on-deep:#06222D;
  --ink:#DCEEF5; --muted:#6E9DB0; --lede:#9FC4D4;
  --line:#1E4A5C; --bar:#17394A; --chip:#0E313F; --sel:#14404F; --ghost-hover:#17414F;
  --ok:#4FC4A0; --ok-bg:#0F3A32; --ok-text:#7FE0C0;
  --no:#E9906F; --no-bg:#3D2018; --no-text:#F2B49B;
  --why-bg:#0F3241; --why-text:#B8DCEA; --why-code:#17404F;
  --shadow:rgba(0,0,0,.5); --shadow2:rgba(0,0,0,.25);
  --ill-o:#D9744F; --ill-y:#D4AC42; --ill-b:#4C9FCB;
  --ill-p:#B77F73; --ill-s:#23414F; --ill-d:#7FD4EE;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--page); color:var(--ink); font-family:var(--sans);
  min-height:100vh; display:grid; place-items:center; padding:28px 20px;
  -webkit-font-smoothing:antialiased;
}
.card{
  width:min(1080px,100%); background:var(--card); border-radius:30px;
  box-shadow:0 24px 60px -20px var(--shadow),0 2px 6px var(--shadow2);
  display:grid; grid-template-columns:42% 58%; overflow:hidden; min-height:660px;
}

/* ---------- left ---------- */
.left{background:var(--panel);padding:36px 38px;display:flex;flex-direction:column}
.back{
  display:inline-flex;align-items:center;gap:9px;color:var(--deep);
  font-size:14px;font-weight:600;text-decoration:none;border:0;background:none;
  cursor:pointer;padding:0;font-family:var(--sans);align-self:flex-start;
}
.back u{text-underline-offset:3px}
.back:disabled{opacity:.35;cursor:default}
.lmid{margin-top:auto;display:flex;flex-direction:column;gap:14px}
.step{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--muted);letter-spacing:.01em}
.q{
  font-family:var(--display);font-size:clamp(26px,3.1vw,38px);line-height:1.12;
  color:var(--deep);margin:0;text-wrap:balance;letter-spacing:-.01em;
}
.hint{font-size:14px;font-weight:600;color:var(--muted);margin:0}
.lbot{margin-top:auto;padding-top:26px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.mark{font-family:var(--display);font-size:19px;color:var(--deep);letter-spacing:-.02em}
.streak{
  font-family:var(--mono);font-size:13px;font-weight:700;color:var(--deep);
  background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:5px 11px;
  display:inline-flex;align-items:center;gap:6px;opacity:0;transition:opacity .25s;
}
.streak.on{opacity:1}
.bar{height:5px;background:var(--bar);border-radius:99px;overflow:hidden;margin-top:16px}
.bar i{display:block;height:100%;background:var(--deep-soft);border-radius:99px;width:0;transition:width .45s cubic-bezier(.22,1,.36,1)}

/* ---------- right ---------- */
.right{padding:34px 38px 30px;display:flex;flex-direction:column;gap:18px}
.art{height:172px;display:grid;place-items:center;flex-shrink:0}
.art svg{height:100%;width:auto;max-width:100%}
.opts{display:flex;flex-direction:column;gap:11px}
.opt{
  display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  background:var(--card);border:1.8px solid var(--line);border-radius:13px;
  padding:14px 17px;font-family:var(--sans);font-size:14.5px;font-weight:600;
  color:var(--ink);cursor:pointer;transition:border-color .16s,background .16s,transform .1s;
}
.opt:hover:not(:disabled){border-color:var(--deep-soft)}
.opt:active:not(:disabled){transform:scale(.994)}
.opt:disabled{cursor:default}
.opt:focus-visible{outline:3px solid var(--deep-soft);outline-offset:2px}
.dot{width:17px;height:17px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;display:grid;place-items:center;transition:border-color .16s}
.dot i{width:8px;height:8px;border-radius:50%;background:var(--deep);transform:scale(0);transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
.opt.sel{border-color:var(--deep);background:var(--sel)}
.opt.sel .dot{border-color:var(--deep)}
.opt.sel .dot i{transform:scale(1)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok-text)}
.opt.ok .dot{border-color:var(--ok)}
.opt.ok .dot i{background:var(--ok);transform:scale(1)}
.opt.no{border-color:var(--no);background:var(--no-bg);color:var(--no-text);animation:nudge .3s}
.opt.no .dot{border-color:var(--no)}
.opt.no .dot i{background:var(--no);transform:scale(1)}
@keyframes nudge{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.key{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:700}

.why{
  border-left:3px solid var(--deep-soft);background:var(--why-bg);border-radius:0 11px 11px 0;
  padding:13px 16px;font-size:13.5px;line-height:1.55;color:var(--why-text);
}
.why b{color:var(--deep)}
.why code{font-family:var(--mono);font-size:12.5px;background:var(--why-code);padding:1.5px 5px;border-radius:4px;color:var(--deep)}
.why .verdict{display:block;font-weight:700;margin-bottom:5px;font-family:var(--sans)}
.why.good{border-left-color:var(--ok);background:var(--ok-bg)}
.why.good .verdict{color:var(--ok-text)}
.why.bad{border-left-color:var(--no);background:var(--no-bg)}
.why.bad .verdict{color:var(--no-text)}

.actions{margin-top:auto;padding-top:6px;display:flex;justify-content:flex-end;gap:11px}
.btn{
  font-family:var(--sans);font-size:14.5px;font-weight:700;padding:11px 24px;
  border-radius:11px;cursor:pointer;border:1.8px solid var(--deep);transition:background .16s,color .16s,opacity .16s;
}
.btn.ghost{background:var(--card);color:var(--deep)}
.btn.ghost:hover:not(:disabled){background:var(--ghost-hover)}
.btn.solid{background:var(--deep);color:var(--on-deep)}
.btn.solid:hover:not(:disabled){background:var(--deep-press);border-color:var(--deep-press);color:var(--on-deep)}
.btn:disabled{opacity:.32;cursor:default}
.btn:focus-visible{outline:3px solid var(--deep-soft);outline-offset:2px}

/* ---------- start / end ---------- */
.pad{display:flex;flex-direction:column;gap:16px;height:100%;justify-content:center}
.big{font-family:var(--display);font-size:clamp(30px,4vw,46px);color:var(--deep);margin:0;line-height:1.1;letter-spacing:-.02em}
.lede{font-size:15px;line-height:1.6;color:var(--lede);margin:0;max-width:46ch}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.tag{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--deep);background:var(--chip);border:1.5px solid var(--line);border-radius:999px;padding:5px 11px}
.score{font-family:var(--mono);font-size:66px;font-weight:700;color:var(--deep);line-height:1;font-variant-numeric:tabular-nums}
.score span{font-size:26px;color:var(--muted)}
.grade{font-family:var(--display);font-size:23px;color:var(--deep);margin:0}
.missed{display:flex;flex-direction:column;gap:7px;max-height:190px;overflow-y:auto;padding-right:4px}
.miss{font-size:13px;line-height:1.45;color:var(--lede);border-left:2.5px solid var(--no);padding-left:11px}
.miss b{color:var(--deep);font-weight:700}


/* Motion: one entrance per screen, staggered so the eye lands on the question
   before the answers. Everything is transform/opacity only — no layout thrash —
   and the whole block is switched off under prefers-reduced-motion below. */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pop{0%{transform:scale(.86)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes grow{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

.card{animation:cardIn .5s cubic-bezier(.22,1,.36,1) both}
.step,.q,.hint,.bar{animation:rise .42s cubic-bezier(.22,1,.36,1) both}
.q{animation-delay:.05s}.hint{animation-delay:.1s}.bar{animation-delay:.15s}
.art{animation:fade .5s ease both}
.art svg{animation:drift 8s ease-in-out infinite}
.opt{animation:rise .38s cubic-bezier(.22,1,.36,1) both}
.opt:nth-child(1){animation-delay:.10s}.opt:nth-child(2){animation-delay:.16s}
.opt:nth-child(3){animation-delay:.22s}.opt:nth-child(4){animation-delay:.28s}
.why{animation:grow .3s cubic-bezier(.22,1,.36,1) both}
.opt.ok .dot i{animation:pop .34s cubic-bezier(.34,1.56,.64,1)}
.streak.on{animation:pop .3s cubic-bezier(.34,1.56,.64,1)}
.big,.score,.grade,.lede,.tags{animation:rise .45s cubic-bezier(.22,1,.36,1) both}
.grade{animation-delay:.08s}.tags{animation-delay:.14s}

/* Theme toggle — sets data-theme, the same mechanism the host uses, so a
   manual choice and the host stamp compose instead of fighting. */
.theme{
  margin-left:auto;width:30px;height:30px;border-radius:9px;flex-shrink:0;
  border:1.5px solid var(--line);background:var(--card);color:var(--deep);
  cursor:pointer;display:grid;place-items:center;padding:0;transition:background .16s,border-color .16s;
}
.theme:hover{background:var(--ghost-hover);border-color:var(--deep-soft)}
.theme:focus-visible{outline:3px solid var(--deep-soft);outline-offset:2px}
.theme svg{width:15px;height:15px;display:block}
.ltop{display:flex;align-items:center;gap:12px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:820px){
  .card{grid-template-columns:1fr;min-height:0}
  .left{padding:26px 24px 22px}
  .lmid{margin-top:22px}
  .lbot{padding-top:18px}
  .right{padding:24px}
  .art{height:120px}
}
</style>

<div class="card" id="card"></div>

<script>
const Q=[
 {q:"Which package is allowed to call os.Getenv?",
  o:["internal/config","internal/postgres","cmd/beacon-api","any package that needs a value"],a:0,
  e:"Everything else takes the typed <code>Config</code> it produced. One place reads the environment, so there is one place to look when a value is wrong.",f:"internal/config/config.go"},

 {q:"JWT_SECRET is unset. You are in development. What happens?",
  o:["The server refuses to boot","It falls back to a hardcoded insecure secret","A random secret is generated each boot","Tokens are issued unsigned"],a:1,
  e:"In <b>production</b> it hard-fails. In development it substitutes <code>devJWTSecret</code> so you can run without ceremony — an asymmetry that is easy to miss when reading.",f:"internal/config/config.go:104"},

 {q:"How many connections does the pool open at most?",
  o:["2","10","25","one per request"],a:1,
  e:"<code>MaxConns: 10</code>, <code>MinConns: 2</code>. The pool is shared across every request — a connection per request is the failure mode it exists to prevent.",f:"internal/postgres/db.go:32"},

 {q:"Migrations: how much runs inside one transaction?",
  o:["The whole run — all files or none","One transaction per file","No transaction; each statement is autocommitted","Only the first file"],a:1,
  e:"Each file's SQL and its <code>schema_migrations</code> row commit together. So a failure on file 5 leaves 1–4 applied — the run is not atomic, each <i>step</i> is.",f:"internal/postgres/migrate.go:54"},

 {q:"Which types satisfy sqlc's DBTX interface?",
  o:["Only *pgxpool.Pool","Only pgx.Tx","Both *pgxpool.Pool and pgx.Tx","Any type with a Query method"],a:2,
  e:"This is the whole mechanism behind <code>q.WithTx(tx)</code>: swap the executor and the same generated query runs inside a transaction. One interface, two lifetimes.",f:"internal/db/db.go:14"},

 {q:"Where does pgx.ErrNoRows become ErrNotFound?",
  o:["The huma handler","The Service","The Repo","classify() in the http layer"],a:2,
  e:"The driver error dies at the Repo. Above it nothing knows what database you use — which is exactly what lets <code>classify()</code> map a <i>domain</i> error to 404.",f:"internal/tasks/tasks.go"},

 {q:"Service holds *pgxpool.Pool. Repo only holds *db.Queries. Why?",
  o:["The Repo would leak connections","Only the Service starts transactions","The pool is not safe to share","Historical accident"],a:1,
  e:"A rule spanning two tables needs <code>Begin()</code>, and deciding that two writes must land together is a <b>business</b> decision, not a data-access one. So the pool lives where the rules live.",f:"internal/tasks/tasks.go"},

 {q:"What is actually in gates.orgScoped?",
  o:["auth → org lookup → role check","auth → tenantRateLimit → idempotency → locale → requireOrg","requireOrg only","auth → requireOrg"],a:1,
  e:"Five links. <b>No role check</b> — that is what makes <code>orgAdmin</code> different. Order is load-bearing: auth first because it supplies the user id everything below reads.",f:"internal/http/gates.go"},

 {q:"User B, not a member of org A, requests org A's project. What comes back?",
  o:["404 not_found","403 not_member","401 unauthenticated","200 with an empty body"],a:1,
  e:"403, deliberately. The caller proved who they are; they simply do not belong here. A 404 would be a small privacy win and a large debugging cost — and membership is not a secret.",f:"internal/http/humamw.go"},

 {q:"A huma output struct declares `Status int`. The handler returns &TaskOutput{Body: t} and never sets Status. What does the client get?",
  o:["200 with the body","200 with an EMPTY body","500","A compile error"],a:1,
  e:"A real bug that shipped. huma uses that field's runtime value — Go's zero is <code>0</code> — and silently skips writing a body for a status it cannot make sense of. <code>DefaultStatus</code> only applies when the struct has <i>no</i> Status field.",f:"internal/http/ops_tasks.go"},

 {q:"Idempotency-Key was documented, sent by the SDK, and completely ignored. Why?",
  o:["The header name was misspelled","It was chi middleware in a group huma never routes through","The database table was missing","Rate limiting consumed it first"],a:1,
  e:"The same trap that forced auth, org and role to become huma gates. Idempotency was the one left behind, so a retried POST created a second row — no error, no log.",f:"internal/http/humamw.go"},

 {q:"One struct tag: `minLength:\"1\"`. How many artefacts does it produce?",
  o:["One — request validation","Two — validation and the OpenAPI doc","Three — validation, openapi.json, and the TypeScript SDK","None; it is documentation only"],a:2,
  e:"Change the Go struct, run <code>make sdk</code>, and the web app stops compiling in the exact places that disagreed. Nothing in that chain is maintained by hand.",f:"internal/http/ops_tasks.go"},

 {q:"Soft-deleting a project must also delete its tasks. Why can't ON DELETE CASCADE do it?",
  o:["The foreign key was never declared","The row still exists, so nothing cascades","Cascades don't work inside transactions","It does — the Go code is redundant"],a:1,
  e:"A soft delete is an <code>UPDATE</code>. From the database's point of view the parent never went anywhere, so the cascade has no event to fire on. It has to be written out.",f:"internal/projects/projects.go"},

 {q:"When is the audit entry written?",
  o:["Best-effort after the delete, like the webhook fan-out","In the same transaction as the delete","By a background worker","On the next read of the audit log"],a:1,
  e:"Deliberately unlike <code>notify.go</code>. A webhook that fails is a retry away from correct; an audit entry that can silently not exist is not evidence at all.",f:"internal/audit/audit.go"},

 {q:"Typing a wrong password used to show no error at all. What was happening?",
  o:["The server returned 200","The SDK treated every 401 as session expiry and reloaded the page","The toast component was broken","The form never submitted"],a:1,
  e:"A full document load to /sign-in wiped the form and the error before anyone could read it. The fix is one clause: a 401 only means expiry if the request <i>carried</i> a token. Sign-in sends none.",f:"sdk/src/client.ts"},

 {q:"Comments have no deleted_at column. How do a soft-deleted task's comments disappear?",
  o:["A trigger removes them","The list query joins tasks and checks it there","They don't — that's a known bug","They are hard-deleted"],a:1,
  e:"Adding that join closed a real latent bug on the way past: the query filtered on <code>task_id</code> alone, never <code>org_id</code>, so any member who knew another org's task id could read its comments.",f:"internal/db/queries/tasks.sql"},
];

/* ---- illustrations: one shape vocabulary, six arrangements ---- */
const C={o:"var(--ill-o)",y:"var(--ill-y)",b:"var(--ill-b)",p:"var(--ill-p)",s:"var(--ill-s)",d:"var(--ill-d)"};
function art(i){
  const v=[
  `<circle cx="60" cy="120" r="26" fill="${C.b}" opacity=".55"/><ellipse cx="150" cy="90" rx="72" ry="46" fill="${C.s}"/><rect x="128" y="96" width="86" height="76" rx="7" fill="${C.p}"/><path d="M150 96 q10-52 26-62 M170 96 q22-40 44-42" stroke="${C.b}" stroke-width="7" fill="none" stroke-linecap="round"/><ellipse cx="176" cy="34" rx="13" ry="20" fill="${C.b}" transform="rotate(-20 176 34)"/><ellipse cx="214" cy="54" rx="13" ry="20" fill="${C.b}" transform="rotate(25 214 54)"/><rect x="40" y="30" width="22" height="22" rx="4" fill="${C.y}" transform="rotate(14 51 41)"/><circle cx="232" cy="140" r="18" fill="${C.y}"/>`,
  `<rect x="52" y="52" width="96" height="96" rx="12" fill="${C.p}"/><circle cx="188" cy="70" r="34" fill="${C.y}"/><path d="M40 160 q60-42 120-10 t100-26" stroke="${C.b}" stroke-width="8" fill="none" stroke-linecap="round"/><rect x="168" y="104" width="60" height="60" rx="9" fill="${C.b}" opacity=".5"/><circle cx="76" cy="34" r="13" fill="${C.o}"/>`,
  `<ellipse cx="140" cy="100" rx="86" ry="60" fill="${C.s}"/><path d="M96 132 q22-70 48-84 q26 14 48 84z" fill="${C.b}" opacity=".62"/><circle cx="144" cy="52" r="17" fill="${C.o}"/><rect x="212" y="112" width="42" height="42" rx="7" fill="${C.y}" transform="rotate(-12 233 133)"/><circle cx="46" cy="60" r="15" fill="${C.p}"/>`,
  `<circle cx="132" cy="98" r="58" fill="${C.b}" opacity=".42"/><rect x="106" y="72" width="112" height="86" rx="10" fill="${C.o}" opacity=".82"/><path d="M52 44 h58 M52 66 h38" stroke="${C.d}" stroke-width="7" stroke-linecap="round"/><circle cx="238" cy="52" r="21" fill="${C.y}"/><path d="M42 150 q46 22 92 0" stroke="${C.p}" stroke-width="9" fill="none" stroke-linecap="round"/>`,
  `<path d="M60 148 q0-88 76-88 q76 0 76 88z" fill="${C.p}"/><circle cx="136" cy="80" r="27" fill="${C.y}"/><rect x="30" y="96" width="34" height="56" rx="6" fill="${C.b}" opacity=".6"/><rect x="212" y="84" width="46" height="68" rx="8" fill="${C.o}" opacity=".75"/><circle cx="200" cy="34" r="12" fill="${C.b}"/>`,
  `<ellipse cx="146" cy="112" rx="94" ry="48" fill="${C.s}"/><circle cx="102" cy="80" r="32" fill="${C.o}" opacity=".82"/><circle cx="164" cy="66" r="22" fill="${C.b}" opacity=".62"/><rect x="196" y="76" width="52" height="76" rx="9" fill="${C.y}" opacity=".85"/><path d="M46 154 h206" stroke="${C.d}" stroke-width="5" stroke-linecap="round" opacity=".28"/>`][i%6];
  return `<svg viewBox="0 0 290 180" fill="none" aria-hidden="true">${v}</svg>`;
}


/* Theme: follow the host until the reader says otherwise, then remember it. */
const SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.5 1.5M17.6 17.6l1.5 1.5M19.1 4.9l-1.5 1.5M6.4 17.6l-1.5 1.5"/></svg>';
const MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>';
function isDark(){
  const st=document.documentElement.getAttribute("data-theme");
  if(st)return st==="dark";
  return matchMedia("(prefers-color-scheme:dark)").matches;
}
function themeBtn(){
  return `<button class="theme" id="theme" aria-label="Switch theme">${isDark()?SUN:MOON}</button>`;
}
function wireTheme(){
  const b=document.getElementById("theme");
  if(!b)return;
  b.onclick=()=>{
    document.documentElement.setAttribute("data-theme",isDark()?"light":"dark");
    b.innerHTML=isDark()?SUN:MOON;
  };
}

let i=0,score=0,streak=0,best=0,picked=null,locked=false,missed=[];
const card=document.getElementById("card");
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");

function shell(left,right){card.innerHTML=`<div class="left">${left}</div><div class="right">${right}</div>`;wireTheme()}

function start(){
  shell(
   `<div class="ltop">${themeBtn()}</div>
    <div class="pad">
      <h1 class="big">Do you<br>actually know<br>Beacon?</h1>
      <p class="lede">Sixteen questions on the two layers you just mapped — the boot chain, sqlc, the Repo/Service split, huma, and the gates. Every answer names the file it came from.</p>
      <div class="tags"><span class="tag">16 questions</span><span class="tag">~6 min</span><span class="tag">keys 1–4</span></div>
    </div>`,
   `<div class="art">${art(0)}</div>
    <div class="pad" style="gap:12px">
      <p class="lede" style="max-width:40ch">Four of these are real bugs this codebase shipped. They are the ones worth getting wrong once.</p>
      <div class="actions" style="margin-top:8px"><button class="btn solid" id="go">Start the drill</button></div>
    </div>`);
  document.getElementById("go").onclick=()=>{i=0;score=0;streak=0;best=0;missed=[];render()};
  document.getElementById("go").focus();
}

function render(){
  picked=null;locked=false;
  const q=Q[i];
  shell(
   `<div class="ltop"><button class="back" id="back" ${i===0?"disabled":""}>← <u>Previous</u></button>${themeBtn()}</div>
    <div class="lmid">
      <div class="step">step ${i+1}/${Q.length}</div>
      <h2 class="q">${esc(q.q)}</h2>
      <p class="hint">Select one answer</p>
      <div class="bar"><i id="fill"></i></div>
    </div>
    <div class="lbot">
      <span class="mark">beacon</span>
      <span class="streak ${streak>1?"on":""}" id="stk">▲ ${streak} in a row</span>
    </div>`,
   `<div class="art">${art(i)}</div>
    <div class="opts" id="opts">${q.o.map((t,n)=>
      `<button class="opt" data-n="${n}"><span class="dot"><i></i></span>${esc(t)}<span class="key">${n+1}</span></button>`).join("")}</div>
    <div id="why"></div>
    <div class="actions">
      <button class="btn ghost" id="skip">Skip</button>
      <button class="btn solid" id="next" disabled>Next</button>
    </div>`);

  requestAnimationFrame(()=>{document.getElementById("fill").style.width=((i)/Q.length*100)+"%"});
  document.getElementById("back").onclick=()=>{if(i>0){i--;render()}};
  document.getElementById("skip").onclick=()=>{if(!locked)choose(-1);else adv()};
  document.getElementById("next").onclick=adv;
  [...document.querySelectorAll(".opt")].forEach(b=>b.onclick=()=>choose(+b.dataset.n));
}

function choose(n){
  if(locked)return;locked=true;picked=n;
  const q=Q[i],btns=[...document.querySelectorAll(".opt")];
  btns.forEach(b=>b.disabled=true);
  const right=n===q.a;
  if(n>=0)btns[n].classList.add(right?"ok":"no");
  if(!right)btns[q.a].classList.add("ok");
  if(right){score++;streak++;best=Math.max(best,streak)}
  else{streak=0;missed.push(q)}
  const s=document.getElementById("stk");
  s.textContent="▲ "+streak+" in a row";s.classList.toggle("on",streak>1);
  document.getElementById("why").innerHTML=
    `<div class="why ${right?"good":"bad"}"><span class="verdict">${
      right?(streak>2?"Right — "+streak+" straight.":"Right."):(n<0?"Skipped.":"Not quite.")
    }</span>${q.e} <code>${q.f}</code></div>`;
  const nx=document.getElementById("next");nx.disabled=false;nx.focus();
  document.getElementById("skip").textContent="Skip";
  document.getElementById("skip").disabled=true;
}

function adv(){ i++; i>=Q.length?end():render() }

function end(){
  const pct=Math.round(score/Q.length*100);
  const g = pct===100?"Flawless. You could have written it."
          : pct>=87?"You know this codebase."
          : pct>=68?"Solid — the shape is in place."
          : pct>=44?"The core is there. The edges are where the bugs live."
          : "Worth another pass through READING.md.";
  shell(
   `<div class="ltop">${themeBtn()}</div>
    <div class="pad">
      <div class="step">result</div>
      <div class="score">${score}<span>/${Q.length}</span></div>
      <h2 class="grade">${g}</h2>
      <div class="tags"><span class="tag">${pct}% correct</span><span class="tag">best streak ${best}</span></div>
    </div>
    <div class="lbot"><span class="mark">beacon</span></div>`,
   `<div class="art">${art(score)}</div>
    <div class="pad" style="gap:12px;justify-content:flex-start">
      ${missed.length?`<p class="lede" style="font-weight:700;color:var(--deep);margin:0">Worth re-reading</p>
      <div class="missed">${missed.map(m=>`<div class="miss"><b>${esc(m.q)}</b><br>${m.f}</div>`).join("")}</div>`
      :`<p class="lede">Nothing missed. Go break something on purpose — that is the other way to learn it.</p>`}
    </div>
    <div class="actions">
      <button class="btn ghost" id="again">Run it again</button>
      <button class="btn solid" id="home">Back to start</button>
    </div>`);
  const sc=document.querySelector(".score");
  if(sc&&!matchMedia("(prefers-reduced-motion:reduce)").matches){
    let n=0;const t=setInterval(()=>{n++;sc.innerHTML=n+"<span>/"+Q.length+"</span>";
      if(n>=score)clearInterval(t)},Math.max(40,520/Math.max(score,1)));
    sc.innerHTML='0<span>/'+Q.length+'</span>';
  }
  document.getElementById("again").onclick=()=>{i=0;score=0;streak=0;best=0;missed=[];render()};
  document.getElementById("home").onclick=start;
}

addEventListener("keydown",e=>{
  if(e.key>="1"&&e.key<="4"){const b=document.querySelectorAll(".opt")[+e.key-1];if(b&&!b.disabled)b.click()}
  if(e.key==="Enter"){const n=document.getElementById("next");if(n&&!n.disabled)n.click()}
});
start();
</script>
