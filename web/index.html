<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beacon</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M9 16 L28 9 L28 23 Z' fill='%23E3FF00'/%3E%3Crect x='4' y='6' width='6' height='20' rx='2.6' fill='%2392278F'/%3E%3C/svg%3E" />
    <script>
      // Theme must be decided before the stylesheet paints or every load
      // flashes the wrong theme for a frame. Three states: the absence of the
      // key means "system". (production-frontend ch11)
      (function () {
        try {
          var stored = localStorage.getItem("beacon-theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <!-- Runtime config. Must load before the app module; see public/config.js. -->
    <script src="/config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
