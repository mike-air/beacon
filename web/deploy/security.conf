# Security headers. Included by EVERY location in nginx.conf that sets a
# header of its own, because nginx drops inherited add_header directives from
# any block that declares one. See the note at the top of nginx.conf.
#
# script-src keeps 'unsafe-inline' for the two inline scripts index.html
# genuinely needs: the theme resolver, which has to run before first paint or
# every load flashes the wrong theme, and the config.js loader. Removing it
# means a nonce, which means templating the HTML at request time, which is a
# real cost for a static file. That trade is recorded here rather than left
# for somebody to rediscover.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ${BEACON_API_BASE}; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
