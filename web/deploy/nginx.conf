# Beacon web — the static server.
#
# ${BEACON_API_BASE} is substituted at start-up by the base image's envsubst
# step. It appears in exactly one place here, the CSP connect-src, and it must
# agree with the value docker-entrypoint.sh writes into config.js: a browser
# that is allowed to reach an origin it is not configured to call, or the
# reverse, fails in a way nothing in the app can report.
#
# ---------------------------------------------------------------------------
# READ THIS BEFORE ADDING AN add_header ANYWHERE
#
# nginx does NOT merge add_header down into a location block. If a location
# declares even one add_header of its own, every add_header from the enclosing
# scope is dropped for that location — silently, with no warning at start-up.
#
# The first version of this file set the security headers once at server level
# and set Cache-Control inside the location blocks. The result was a site with
# no Content-Security-Policy on its HTML at all: `location = /index.html` had
# an add_header, so it inherited none of them, and the HTML document is the
# only response where a CSP does anything. It was caught by curling the
# running container, not by reading the config, which is the whole argument
# for testing an image rather than reviewing it.
#
# So: security.conf is INCLUDED in every location that sets a header. Adding a
# new location means including it there too.
# ---------------------------------------------------------------------------

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The performance budget measures GZIPPED bytes, so the server has to
    # actually compress or the budget is measuring a fiction.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ---- caching -----------------------------------------------------------
    # Vite fingerprints everything in /assets, so those files are immutable by
    # construction: a change produces a new name. One year, and one
    # Cache-Control header — `expires` emits its own, so using both ships two
    # conflicting values.
    location /assets/ {
        include /etc/nginx/conf.d/beacon-security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # index.html and config.js are the two files that must NEVER be cached.
    # index.html names the current asset hashes; config.js carries the API
    # base. A stale copy of either points a fresh deploy at the wrong thing.
    #
    # config.js is served from /tmp, not from the web root: the entrypoint
    # writes it at start-up, and the root is deliberately not writable by the
    # nginx user, so a compromised worker cannot edit what it serves.
    location = /config.js {
        include /etc/nginx/conf.d/beacon-security.conf;
        alias /tmp/beacon/config.js;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
    }

    location = /index.html {
        include /etc/nginx/conf.d/beacon-security.conf;
        add_header Cache-Control "no-store" always;
    }

    # Liveness. Answers without touching the filesystem or the API.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- the SPA fallback --------------------------------------------------
    # TanStack Router owns the URL space, so any path that is not a real file
    # is a route the client renders. Without this, a reload on /orgs/x/board
    # is a 404 from nginx — the classic single-page-app deploy bug, and one
    # that never appears in dev because the Vite server already does this.
    location / {
        include /etc/nginx/conf.d/beacon-security.conf;
        try_files $uri $uri/ /index.html;
    }
}
