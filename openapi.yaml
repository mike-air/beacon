# The Beacon HTTP contract.
#
# Written from the handlers in internal/http/, not the other way round: this
# file describes the server that exists. It is the input to the web client's
# `npm run generate:api`, so a drift between this document and the Go code
# shows up as a TypeScript error in the client rather than a 500 in the wild.
#
# When you change a handler's shape, change this file in the same commit.
openapi: 3.1.0

info:
  title: Beacon API
  version: "1.0.0"
  description: |
    A multi-tenant task board. Every resource below the org level is scoped to
    one organisation, and that scope is enforced twice: once in middleware
    (`requireOrg`), once in the SQL.

    **Auth** is a single bearer JWT from `POST /v1/auth/login`. There is no
    refresh endpoint — when the token expires the client must sign in again.

    **Errors** all share one envelope. Clients should parse `error.code`, not
    the message.

    **Idempotency**: any mutating request may carry an `Idempotency-Key`. The
    server replays the original response for a repeated key rather than
    performing the write twice.

    **Rate limits**: auth endpoints are limited per IP, everything else per
    org. Both answer `429` with `Retry-After`.

servers:
  - url: http://localhost:8080
    description: local
  - url: /
    description: same origin

security:
  - bearerAuth: []

tags:
  - name: ops
  - name: auth
  - name: me
  - name: orgs
  - name: members
  - name: projects
  - name: tasks
  - name: comments
  - name: attachments
  - name: search
  - name: webhooks
  - name: events

paths:
  /healthz:
    get:
      tags: [ops]
      summary: Liveness. The process is up.
      security: []
      responses:
        "200":
          description: alive
          content:
            application/json:
              schema:
                type: object
                properties: { status: { type: string } }

  /readyz:
    get:
      tags: [ops]
      summary: Readiness. Dependencies answer.
      security: []
      responses:
        "200": { description: ready }
        "503": { description: a dependency is down }

  /v1/auth/signup:
    post:
      tags: [auth]
      summary: Create an account
      description: Returns the user. It does NOT return a token — the client must log in.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignupRequest" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/auth/login:
    post:
      tags: [auth]
      summary: Exchange credentials for a token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Validation" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/me:
    get:
      tags: [me]
      summary: The authenticated user
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/me/preferences:
    get:
      tags: [me]
      summary: Locale and timezone, plus what the cascade resolved for this request
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Preferences" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [me]
      summary: Set locale and timezone
      description: An empty string clears the preference and hands the decision back to the cascade.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PreferencesRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Preferences" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Validation" }

  /v1/orgs:
    get:
      tags: [orgs]
      summary: Organisations the caller belongs to, each with their role
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/OrgWithRole" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [orgs]
      summary: Create an organisation
      description: The caller becomes its owner.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrgRequest" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Org" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Validation" }

  /v1/orgs/{orgID}/members:
    parameters:
      - $ref: "#/components/parameters/OrgID"
    get:
      tags: [members]
      summary: Members of the organisation
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Member" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [members]
      summary: Add a member by email
      description: Requires the caller to be an owner or admin.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddMemberRequest" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Membership" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }

  /v1/orgs/{orgID}/search:
    parameters:
      - $ref: "#/components/parameters/OrgID"
    get:
      tags: [search]
      summary: Search every entity in the organisation
      description: |
        `source` reports which engine answered — `meili` or `postgres`. The
        Postgres path is the fallback, and a client that shows the difference
        is telling the operator something true.
      parameters:
        - name: q
          in: query
          required: true
          description: At least 2 characters. Longer than 200 is truncated, not rejected.
          schema: { type: string, minLength: 2 }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResult" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }

  /v1/orgs/{orgID}/events:
    parameters:
      - $ref: "#/components/parameters/OrgID"
    get:
      tags: [events]
      summary: Server-sent events for the organisation
      description: |
        A `text/event-stream`. Each message is `event: <type>` with a JSON
        `data:` payload; comment lines (`: keep-alive`) are heartbeats.

        Event types: `task.created`, `task.updated`, `task.deleted`. The data
        payload is the task.

        A slow consumer is dropped rather than allowed to block the publisher,
        so a client must treat the stream as a hint to refetch, never as the
        only source of truth.
      responses:
        "200":
          description: the stream
          content:
            text/event-stream:
              schema: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/orgs/{orgID}/webhooks:
    parameters:
      - $ref: "#/components/parameters/OrgID"
    get:
      tags: [webhooks]
      summary: Registered webhooks
      description: Owner/admin only.
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Webhook" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [webhooks]
      summary: Register a webhook
      description: |
        The response is the only time the signing `secret` is returned in full.
        A client that does not show it here cannot show it later.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterWebhookRequest" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }

  /v1/orgs/{orgID}/webhooks/{webhookID}:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - name: webhookID
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [webhooks]
      summary: Delete a webhook
      responses:
        "204": { description: deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/orgs/{orgID}/projects:
    parameters:
      - $ref: "#/components/parameters/OrgID"
    get:
      tags: [projects]
      summary: Projects in the organisation
      description: |
        Two shapes behind the `new_board_ui` flag. The v2 response is the v1
        response plus `board: "v2"`; the client uses that marker to decide
        which board to render, so the server stays the single source of truth
        about which experiment arm the user is in.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectList" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [projects]
      summary: Create a project
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectRequest" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }

  /v1/orgs/{orgID}/projects/{projectID}:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - $ref: "#/components/parameters/ProjectID"
    get:
      tags: [projects]
      summary: One project
      description: |
        Answers `304` when `If-None-Match` still matches. The ETag is derived
        from the row's id and `updated_at`, so it changes exactly when the row
        does.
      parameters:
        - name: If-None-Match
          in: header
          schema: { type: string }
      responses:
        "200":
          description: ok
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "304": { description: unchanged }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [projects]
      summary: Rename a project
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
    delete:
      tags: [projects]
      summary: Delete a project and everything in it
      responses:
        "204": { description: deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/orgs/{orgID}/projects/{projectID}/tasks:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - $ref: "#/components/parameters/ProjectID"
    get:
      tags: [tasks]
      summary: Tasks in the project
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Task" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [tasks]
      summary: Create a task
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTaskRequest" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }

  /v1/orgs/{orgID}/projects/{projectID}/tasks/{taskID}:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/TaskID"
    get:
      tags: [tasks]
      summary: One task
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [tasks]
      summary: Update a task
      description: |
        A full replacement of the mutable fields: `title` and `status` are both
        required. Moving a card on the board is this call with a new `status`
        and `position`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTaskRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
    delete:
      tags: [tasks]
      summary: Delete a task
      responses:
        "204": { description: deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/orgs/{orgID}/projects/{projectID}/tasks/{taskID}/comments:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/TaskID"
    get:
      tags: [comments]
      summary: Comments on the task
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Comment" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [comments]
      summary: Comment on the task
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCommentRequest" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }

  /v1/orgs/{orgID}/projects/{projectID}/tasks/{taskID}/attachments:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/TaskID"
    get:
      tags: [attachments]
      summary: Attachments on the task
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Attachment" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/StorageDisabled" }
    post:
      tags: [attachments]
      summary: Reserve an attachment and get a presigned upload URL
      description: |
        The file never passes through this API. The client PUTs the bytes
        straight to `upload_url`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAttachmentRequest" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttachmentEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
        "501": { $ref: "#/components/responses/StorageDisabled" }

  /v1/orgs/{orgID}/projects/{projectID}/tasks/{taskID}/attachments/{attachmentID}:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/TaskID"
      - name: attachmentID
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [attachments]
      summary: One attachment, with a presigned download URL
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttachmentEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/StorageDisabled" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The token from `POST /v1/auth/login`. There is no refresh endpoint.

  parameters:
    OrgID:
      name: orgID
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProjectID:
      name: projectID
      in: path
      required: true
      schema: { type: string, format: uuid }
    TaskID:
      name: taskID
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        A client-generated key. Repeating a request with the same key replays
        the original response instead of performing the write twice.
      schema: { type: string, maxLength: 255 }

  responses:
    Unauthorized:
      description: missing or invalid token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: authenticated, but not allowed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: no such resource in this organisation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: already exists
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Validation:
      description: the body failed validation; `error.fields` names each failure
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: too many requests
      headers:
        Retry-After:
          description: seconds to wait before retrying
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    StorageDisabled:
      description: file storage is not configured on this server
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: The stable identifier. Branch on this, never on the message.
            message: { type: string }
            fields:
              type: array
              items: { $ref: "#/components/schemas/FieldError" }
    FieldError:
      type: object
      required: [field, rule, message]
      properties:
        field: { type: string }
        rule: { type: string }
        message: { type: string }

    ListEnvelope:
      type: object
      required: [items, limit, offset]
      properties:
        items: { type: array, items: {} }
        limit: { type: integer }
        offset: { type: integer }

    User:
      type: object
      required: [id, email, name, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        created_at: { type: string, format: date-time }

    SignupRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        name: { type: string, maxLength: 200 }
        password: { type: string, minLength: 12, maxLength: 200 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    LoginResponse:
      type: object
      required: [token, user]
      properties:
        token: { type: string }
        user: { $ref: "#/components/schemas/User" }

    Preferences:
      type: object
      required: [locale, timezone, resolved_locale, now_utc, now_local, greeting, example_price]
      properties:
        locale:
          type: string
          description: The stored preference. Empty means "no preference".
        timezone: { type: string, description: An IANA name, never an offset. }
        resolved_locale:
          type: string
          description: What the cascade actually decided for THIS request.
        now_utc: { type: string, format: date-time }
        now_local: { type: string }
        greeting: { type: string }
        example_price: { type: string }
    PreferencesRequest:
      type: object
      properties:
        locale: { type: string, maxLength: 35 }
        timezone: { type: string, maxLength: 64 }

    Role:
      type: string
      enum: [owner, admin, member]

    Org:
      type: object
      required: [id, name, slug, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        created_at: { type: string, format: date-time }
    OrgWithRole:
      allOf:
        - $ref: "#/components/schemas/Org"
        - type: object
          required: [role]
          properties:
            role: { $ref: "#/components/schemas/Role" }
    CreateOrgRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }

    Membership:
      type: object
      required: [id, user_id, org_id, role, created_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/Role" }
        created_at: { type: string, format: date-time }
    Member:
      type: object
      required: [user_id, email, name, role]
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
    AddMemberRequest:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/Role" }

    Project:
      type: object
      required: [id, org_id, name, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        name: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProjectRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
    ProjectList:
      allOf:
        - $ref: "#/components/schemas/ListEnvelope"
        - type: object
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Project" }
            board:
              type: string
              enum: ["v2"]
              description: |
                Present only on the v2 branch of the `new_board_ui` experiment.
                Absent means v1. The client renders the board this field names.

    TaskStatus:
      type: string
      enum: [todo, in_progress, done]
    Task:
      type: object
      required: [id, org_id, project_id, title, status, position, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        title: { type: string }
        status: { $ref: "#/components/schemas/TaskStatus" }
        position:
          type: number
          format: double
          description: |
            A sort key within a column. It is a float so a card can be inserted
            between two others without renumbering the rest.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateTaskRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        status: { $ref: "#/components/schemas/TaskStatus" }
        position: { type: number, format: double }
    UpdateTaskRequest:
      type: object
      required: [title, status]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        status: { $ref: "#/components/schemas/TaskStatus" }
        position: { type: number, format: double }

    Comment:
      type: object
      required: [id, task_id, author_id, body, created_at]
      properties:
        id: { type: string, format: uuid }
        task_id: { type: string, format: uuid }
        author_id: { type: string, format: uuid }
        body: { type: string }
        created_at: { type: string, format: date-time }
    CreateCommentRequest:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 10000 }

    Attachment:
      type: object
      required: [id, task_id, filename, content_type, size_bytes, storage_key, created_at]
      properties:
        id: { type: string, format: uuid }
        task_id: { type: string, format: uuid }
        filename: { type: string }
        content_type: { type: string }
        size_bytes: { type: integer, format: int64 }
        storage_key: { type: string }
        created_at: { type: string, format: date-time }
    CreateAttachmentRequest:
      type: object
      required: [filename, content_type, size]
      properties:
        filename: { type: string, minLength: 1, maxLength: 500 }
        content_type: { type: string, minLength: 1, maxLength: 200 }
        size: { type: integer, format: int64, minimum: 1, maximum: 5368709120 }
    AttachmentEnvelope:
      type: object
      required: [attachment]
      properties:
        attachment: { $ref: "#/components/schemas/Attachment" }
        upload_url:
          type: string
          description: Presigned PUT. Present on create only, and short-lived.
        download_url:
          type: string
          description: Presigned GET. Present on read only, and short-lived.

    Webhook:
      type: object
      required: [id, org_id, url, events, active, created_at]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        url: { type: string }
        secret:
          type: string
          description: Returned in full only in the create response.
        events:
          type: array
          items: { type: string }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
    RegisterWebhookRequest:
      type: object
      required: [url]
      properties:
        url: { type: string, maxLength: 2000 }
        events:
          type: array
          items: { type: string, maxLength: 100 }
          description: Empty means every event.

    SearchHit:
      type: object
      required: [kind, id, title, snippet]
      properties:
        kind: { type: string, description: 'The entity type: "project", "task", "comment".' }
        id: { type: string, format: uuid }
        title: { type: string }
        snippet: { type: string }
        rank: { type: number, format: float }
    SearchResult:
      type: object
      required: [hits, source]
      properties:
        hits:
          type: array
          items: { $ref: "#/components/schemas/SearchHit" }
        source:
          type: string
          enum: [postgres, meili]
          description: Which engine answered. `postgres` means the fallback fired.
